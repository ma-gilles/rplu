name: ChatGPT Lean certification

on:
  push:
    branches:
      - chatgpt/lean-certification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-cert
    steps:
      - uses: actions/checkout@v4

      - name: Materialize the single Lean source
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > PsdCholeskyCertified.lean

      - name: Reject placeholders and custom axioms
        shell: bash
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' PsdCholeskyCertified.lean; then
            echo 'Forbidden placeholder or custom axiom found.' >&2
            exit 1
          fi

      - name: Install Elan
        shell: bash
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib and compiled cache
        shell: bash
        run: |
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get

      - name: Kernel-check the single file
        shell: bash
        run: "$HOME/.elan/bin/lake" env lean PsdCholeskyCertified.lean

      - name: Upload checked source
        uses: actions/upload-artifact@v4
        with:
          name: PsdCholeskyCertified
          path: lean-cert/PsdCholeskyCertified.lean
          if-no-files-found: error
